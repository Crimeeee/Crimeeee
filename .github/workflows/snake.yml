name: Generate Snake
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch: {}
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: Crimeeee
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23f0abfc&color_dots=%23161b22,%233b0764,%237e22ce,%23c026d3,%23f0abfc
            dist/github-contribution-grid-snake-dark.svg?color_snake=%23f0abfc&color_dots=%23161b22,%233b0764,%237e22ce,%23c026d3,%23f0abfc

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
